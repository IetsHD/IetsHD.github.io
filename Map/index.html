<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Interactieve kaart</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <aside class="panel">
    <h1>Interactieve kaart</h1>
    <p>
      Markers worden geladen uit <code>markers.json</code>. Per marker kun je een eigen kleur instellen.
    </p>
    <p class="hint">
      Tip: klik op de kaart om de x/y-coördinaten te tonen. Gebruik die waarden in <code>markers.json</code>.
    </p>
    <div id="status">Markers laden...</div>
    <h2>Markers</h2>
    <div id="markerList" class="marker-list"></div>
  </aside>

  <main id="map" aria-label="Interactieve kaart"></main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
